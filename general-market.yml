name: "Lola General Marketplace"
description: "Official curated collection of Lola modules"
version: "1.0.0"

modules:
  - name: "lola-manager"
    description: "Build Lola modules with workflow guidance"
    version: "0.1.0"
    repository: "https://github.com/mrbrandao/lola-manager"
    tags:
      - "module-builder"
      - "workflow"
      - "scaffolding"
      - "all"

  - name: "chef-buddy"
    description: "Lazy context loading demonstration"
    version: "0.1.0"
    repository: "https://github.com/mrbrandao/cheff-buddy"
    tags:
      - "demo"
      - "lazy-loading"
      - "tutorial"
      - "all"

  - name: "openssf-skill"
    description: "OpenSSF Security Instructions for AI Coding Assistants"
    version: "v0.1.0"
    repository: "https://github.com/ryanwaite/openssf-skill.git"
    tags:
      - "openssf"
      - "security"
      - "instructions"
      - "all"

  - name: "secdevai"
    description: "AI-powered secure development assistant with OWASP Top 10 and WSTG security analysis"
    version: "0.1.0"
    repository: "https://github.com/RedHatProductSecurity/secdevai"
    path: "lola-module"
    tags:
      - "security"
      - "owasp"
      - "wstg"
      - "security-review"
      - "sarif"
      - "all"

  - name: "threat-model"
    description: "AI-assisted threat modeling with STRIDE, PASTA, LINDDUN, VAST, Attack Trees, and OCTAVE, automatic threat actor profiling, and narrative attack scenarios grounded in code citations"
    version: "0.1.0"
    repository: "https://github.com/RedHatProductSecurity/agentic-threat-modeling"
    path: "module"
    tags:
      - "threat-modeling"
      - "security"
      - "stride"
      - "architecture"
      - "all"
